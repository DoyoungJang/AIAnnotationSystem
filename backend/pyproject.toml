[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonolabel-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3", "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1", "psycopg[binary]>=3.2,<4",
  "pillow>=10,<12", "pydicom>=3,<4", "numpy>=1.26,<3", "alembic>=1.13,<2",
  "py7zr==1.1.3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]
