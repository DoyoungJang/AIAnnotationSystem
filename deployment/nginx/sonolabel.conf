server {
    listen 443 ssl http2;
    server_name sonolabel.internal;
    ssl_certificate /etc/sonolabel/tls/fullchain.pem;
    ssl_certificate_key /etc/sonolabel/tls/privkey.pem;
    client_max_body_size 256m;
    location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
