services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonolabel}
      POSTGRES_USER: ${POSTGRES_USER:-sonolabel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 20}
    networks: [internal]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    networks: [internal]
  api:
    build: ./backend
    env_file: .env
    depends_on: {db: {condition: service_healthy}}
    volumes: ["medical-storage:/data/storage", "exports:/data/exports"]
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
    networks: [internal]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run"]
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres-data:
  redis-data:
  medical-storage:
  exports:
networks:
  internal:
    internal: true
